name: petrol_log
description: A Flutter app to log vehicle maintenance, fuel activity, and mileage.

publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  csv: ^8.0.0
  file_picker: ^11.0.2
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

# Pin path_provider_foundation to its last pre-native-assets release. 2.5.0+
# migrated to the experimental objective_c FFI framework, whose arm64 slice is
# tagged for the iOS Simulator and fails App Store validation (error 409,
# "Simulator platforms aren't permitted"). 2.4.x keeps file_picker working
# without bundling objective_c.framework.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
